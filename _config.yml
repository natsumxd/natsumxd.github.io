# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 夏日手帖
subtitle: Natsumxd's Notebook
description: 记录生活、代码，和慢慢长大的日子。Notes on life, code, and slow-growing days.
keywords: 博客, 随笔, 技术, 生活记录
author: natsumxd
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://natsumxd.github.io
root: /
permalink: posts/:year:month:day-:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  preprocess: false
  line_number: false
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 8
  order_by: -date

# Category & Tag
default_category: 随笔
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: 'mtime'

# Pagination
per_page: 8
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: warm

# Local search index
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true

# Deployment
## GitHub Pages: repo natsumxd.github.io, published from `main` branch root
deploy:
  type: ''
